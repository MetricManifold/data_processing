[package]
name = "cell_analyze"
version = "0.1.0"
edition = "2021"
description = "Trajectory analysis + study pipeline for the multi-cell phase-field simulator."

[dependencies]
anyhow = "1.0"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }
png = "0.17"
rayon = "1.8"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[lib]
name = "cell_analyze"
path = "src/lib.rs"

[[bin]]
name = "cell_analyze"
path = "src/main.rs"

# Per-observable runnable examples. Each one loads a trajectory and
# computes one observable. Run with:
#   cargo run --release --example <name>           # uses default ctrl run
#   cargo run --release --example <name> -- <dir>  # specify run dir
