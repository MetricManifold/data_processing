[study]
name = "palmieri_lag_72c"
description = "Palmieri 72-cell validation with lag binary (offset-fixed)"

[discovery]
pattern = "prod_lag_{cond}/run_{seed}"
trajectory_name = "trajectory.txt"

[observables]
compute = ["msd", "per_cell_diffusion", "velocity_distribution", "shape_index", "velocity_autocorrelation"]
tau = 10000.0
cell_radius = 49.0
fit_frac = 0.3

[analysis]
group_by = ["seed"]
pair_by = "cond"
pair_numerator = "soft"
pair_denominator = "ctrl"

[analysis.metrics]
d_eff = "tagged_cell_d_eff"
d_eff_pop = "population_d_eff"
ln = "tagged_cell_ln"
kurtosis = "tagged_cell_kurtosis"
mean_speed = "tagged_cell_mean_speed"

[diagnostic]
output = "diag_lag_run{seed}.svg"

[[diagnostic.panels]]
type = "trajectory"

[[diagnostic.panels]]
type = "msd_t"
log_x = true
log_y = true

[[diagnostic.panels]]
type = "ln_timeseries"

[[diagnostic.panels]]
type = "ln_histogram"

[[diagnostic.panels]]
type = "speed_bursts"

[[diagnostic.panels]]
type = "gvi"

[[diagnostic.panels]]
type = "deff_bar"

[[diagnostic.panels]]
type = "summary"
