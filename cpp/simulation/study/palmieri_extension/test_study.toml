[study]
name = "palmieri_ext_100c"
description = "Palmieri extension: soft cell 0 vs control"

[discovery]
pattern = "prod_100c_rho{rho}_{cond}_v{seed}"
trajectory_name = "trajectory.txt"

[observables]
compute = ["msd", "diffusion"]
tau = 10000.0
cell_radius = 49.0
fit_frac = 0.3

[analysis]
pair_by = "seed"
numerator = "soft"
denominator = "ctrl"
group_by = ["rho", "cond"]

[diagnostic]
output = "diag_100c_rho{rho}_{seed}.svg"

[[diagnostic.panels]]
type = "trajectory"

[[diagnostic.panels]]
type = "msd_t"
log_x = true
log_y = true

[[diagnostic.panels]]
type = "deff_bar"

[[diagnostic.panels]]
type = "summary"
