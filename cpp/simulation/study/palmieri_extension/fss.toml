# Palmieri FSS — Single Soft Cell Finite-Size Scaling
#
# Computes D_eff of the tagged soft cell (cell 0) vs the same cell in the
# all-normal control, averaged over replicate seeds, as a function of N.
#
# Usage:
#   cell_analyze study studies/palmieri_fss.toml -d /path/to/fss_reps -o results/fss.json
#   cell_analyze study studies/palmieri_fss.toml -d /path/to/fss_reps --dry-run

[study]
name = "Palmieri FSS"
description = "D_eff(soft cell 0) / D_eff(ctrl cell 0) vs system size N"

[discovery]
pattern = "{N}c_rho{rho}_{cond}/run_{seed}"

[observables]
compute = ["per_cell_diffusion", "shape_index", "velocity_distribution"]
tau = 10000.0
cell_radius = 49.0
fit_frac = 0.3

[analysis]
tagged_cell = 0
group_by = ["N", "rho", "cond"]
pair_by = "cond"
pair_numerator = "soft"
pair_denominator = "ctrl"

[analysis.metrics]
d_eff = "tagged_cell_d_eff"
d_eff_pop = "population_d_eff"
d_eff_normal = "normal_d_eff"
ln = "tagged_cell_ln"
ln_pop = "population_ln"
kurtosis = "tagged_cell_kurtosis"
mean_speed = "tagged_cell_mean_speed"

# ============================================================================
# Plots — generated as SVG alongside the output JSON
# ============================================================================

[[plots]]
title = "D_eff ratio vs 1/sqrt(N)"
x = "N"
y = "d_eff_ratio"
output = "fss_deff_ratio.svg"
x_label = "1/sqrt(N)"
y_label = "D_eff(soft) / D_eff(ctrl)"
x_transform = "inverse_sqrt"
error_bars = true

[[plots]]
title = "L_n gap vs N"
x = "N"
y = "ln_diff"
output = "fss_ln_gap.svg"
x_label = "N"
y_label = "L_n(soft) - L_n(ctrl)"
error_bars = true

# ============================================================================
# Multi-panel figures
# ============================================================================

[[figures]]
title = "FSS Summary — Palmieri Extension"
output = "fss_summary.svg"
layout = [2, 3]
width = 1200
height = 800

[[figures.panels]]
x = "N"
y = "d_eff_ratio"
title = "D_eff ratio"
y_label = "D_eff(soft) / D_eff(ctrl)"
h_line = 1.0

[[figures.panels]]
x = "N"
y = "ln_ratio"
title = "L_n ratio"
y_label = "L_n(soft) / L_n(ctrl)"
h_line = 1.0

[[figures.panels]]
x = "N"
y = "mean_speed_ratio"
title = "Speed ratio"
y_label = "speed(soft) / speed(ctrl)"
h_line = 1.0

[[figures.panels]]
x = "N"
y = "d_eff_diff"
title = "D_eff difference"
y_label = "D_eff(soft) - D_eff(ctrl)"
h_line = 0.0

[[figures.panels]]
x = "N"
y = "ln_diff"
title = "L_n gap"
y_label = "L_n(soft) - L_n(ctrl)"
h_line = 0.0

[[figures.panels]]
x = "N"
y = "d_eff_pop_ratio"
title = "Population D_eff ratio"
y_label = "pop D_eff(soft run) / pop D_eff(ctrl run)"
h_line = 1.0
