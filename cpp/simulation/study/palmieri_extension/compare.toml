# Palmieri comparison panel configuration
# Used with: cell_analyze compare soft ctrl --config compare.toml

# Global axis settings
ln_range = [0.98, 1.5]
speed_max = 0.015
msd_lag_max = 8.0

# Panel layout (order determines position in the 2×4 grid)
# Available types: trajectory, msd_t, ln_timeseries, ln_histogram,
#                  speed_bursts, gvi, deff_bar, summary

[[panels]]
type = "trajectory"

[[panels]]
type = "msd_t"
# x_range = [0.0, 8.0]   # uncomment to override

[[panels]]
type = "ln_timeseries"

[[panels]]
type = "ln_histogram"
bins = 50

[[panels]]
type = "speed_bursts"

[[panels]]
type = "gvi"
bins = 80
# x_range = [0.0, 0.022]  # uncomment to override
# y_range = [-3.5, 0.5]

[[panels]]
type = "deff_bar"

[[panels]]
type = "summary"
